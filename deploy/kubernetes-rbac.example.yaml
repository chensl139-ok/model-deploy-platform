# 将命名空间 launchpad-inference 改为实际允许的位置。
# 不在 OrbStack 上自动应用；生产请由集群管理员审核后绑定专用身份。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: launchpad
  namespace: launchpad-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchpad
  namespace: launchpad-inference
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, update, delete]
  - apiGroups: ['']
    resources: [services]
    verbs: [get, list, create, update, delete]
  - apiGroups: ['']
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchpad
  namespace: launchpad-inference
subjects:
  - kind: ServiceAccount
    name: launchpad
    namespace: launchpad-inference
roleRef:
  kind: Role
  name: launchpad
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: launchpad-inspect
rules:
  - apiGroups: ['']
    resources: [namespaces]
    resourceNames: [launchpad-inference]
    verbs: [get]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: launchpad-inspect
subjects:
  - kind: ServiceAccount
    name: launchpad
    namespace: launchpad-inference
roleRef:
  kind: ClusterRole
  name: launchpad-inspect
  apiGroup: rbac.authorization.k8s.io
